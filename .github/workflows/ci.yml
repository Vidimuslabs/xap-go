name: ci
on:
  push:
  pull_request:

# Least privilege. The GITHUB_TOKEN only needs to read this repo; the private
# sibling is fetched with a separate scoped PAT (CI_PAT) below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # xap-go depends on the private xap-spec via a replace directive. Both are
      # checked out side by side under the workspace so `replace ../xap-spec`
      # resolves; the private sibling needs a token with read access (CI_PAT).
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment tracks the version. Dependabot keeps these current.
      # fetch-depth: 0 so the gitleaks step below scans the whole history.
      # checkout defaults to a depth-1 clone, which leaves `gitleaks detect` —
      # a history scanner — with exactly one commit to look at. Making the
      # repository public exposes every commit ever made, so the scan has to
      # cover every commit ever made. Only this checkout needs it; gitleaks does
      # not scan the xap-spec sibling.
      - name: Checkout xap-go
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: xap-go
          fetch-depth: 0
      # Fork PRs and Dependabot runs receive no Actions secrets, so CI_PAT
      # arrives empty and the checkout below dies with "Input required and not
      # supplied: token" — an error that names actions/checkout and points
      # nowhere near the cause. Verified on run 31426645776: "Checkout xap-spec
      # (private sibling)" fails in 8s and every later step is skipped.
      #
      # This cannot be made GREEN before the flip. xap-spec is private, and
      # neither a fork nor Dependabot can reach it by any route, so there is no
      # credential to supply and no honest way to report the code as verified.
      # What it can be is legible: fail here, saying which runs this hits and
      # what removes it. See CF-xap-36 / CF-xap-21.
      - name: preflight — credentials for the private sibling
        env:
          CI_PAT: ${{ secrets.CI_PAT }}
        run: |
          if [ -n "$CI_PAT" ]; then
            echo "CI_PAT present; the private sibling can be checked out."
            exit 0
          fi
          echo "::error title=No credentials for the private sibling::This run \
          received no Actions secrets, so xap-spec (still private) cannot be \
          checked out and nothing below could verify your change. Fork pull \
          requests and Dependabot runs never receive them — this is not \
          something your branch did wrong, and re-running will not help. It \
          disappears when xap-spec is published and the 'replace' directive \
          leaves go.mod (CF-xap-36). A maintainer can verify this branch by \
          pushing it to the upstream repository."
          exit 1

      - name: Checkout xap-spec (private sibling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Vidimuslabs/xap-spec
          token: ${{ secrets.CI_PAT }}
          path: xap-spec

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: xap-go/go.mod

      - name: gofmt
        working-directory: xap-go
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: go vet
        working-directory: xap-go
        run: go vet ./...

      - name: staticcheck
        working-directory: xap-go
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: govulncheck
        working-directory: xap-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        working-directory: xap-go
        run: |
          # Installed from the Go module proxy rather than fetched from the
          # GitHub release host.
          #
          # The release download failed four times on 2026-08-12 across four
          # repositories — one 503 and three dropped connections — each a red
          # main unrelated to the code. Retries were added and did not help: the
          # last failure exhausted all five attempts and every one returned 503,
          # because retrying does not fix a host that is down.
          #
          # So this removes the failure domain instead of retrying it. Every job
          # here already depends on proxy.golang.org for `go build`, and both
          # staticcheck and govulncheck already arrive this way, so gitleaks
          # stops being the one tool carrying its own availability risk. The
          # module proxy verifies the download against the checksum database,
          # which is a stronger guarantee than a SHA-256 pinned here by hand —
          # and it installs outside the checkout, so the tool is not part of
          # what it scans.
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: test (race)
        working-directory: xap-go
        run: go test -race ./...

      - name: coverage gate (80%)
        working-directory: xap-go
        run: |
          go test -coverpkg=github.com/Vidimuslabs/xap-go,github.com/Vidimuslabs/xap-go/canonical \
            -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "SDK coverage: ${pct}%"
          awk "BEGIN {exit !(${pct} >= 80.0)}" || (echo "coverage ${pct}% below 80% gate" && exit 1)

      - name: conformance vectors
        working-directory: xap-go
        run: go run ./cmd/xap vectors run
