name: ci
on:
  push:
  pull_request:

# Least privilege. The GITHUB_TOKEN only needs to read this repo. Nothing here
# consumes a secret: xap-spec resolves from the module proxy like any other
# dependency, so a pull request from a fork — which never receives Actions
# secrets — runs exactly the same steps as a push to main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment tracks the version. Dependabot keeps these current.
      # fetch-depth: 0 so the gitleaks step below scans the whole history.
      # checkout defaults to a depth-1 clone, which leaves `gitleaks detect` —
      # a history scanner — with exactly one commit to look at. This repository
      # is public, so every commit ever made is exposed and the scan has to
      # cover every commit ever made.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # xap-spec must resolve as a published module. Fail here if go.mod still
      # replaces a Vidimuslabs path — consumers ignore replace, so the module
      # would be uninstallable.
      - name: go mod download
        run: go mod download

      - name: go.mod is proxy-resolvable
        run: |
          if grep -q '^replace github.com/Vidimuslabs/' go.mod; then
            echo 'go.mod still replaces a Vidimuslabs module; consumers ignore'
            echo 'replace, so this repository would be uninstallable.'
            exit 1
          fi

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        run: |
          # Installed from the Go module proxy rather than fetched from the
          # GitHub release host. The release download failed four times on
          # 2026-08-12 across four repositories; retries were added and did not
          # help, because retrying does not fix a host that is down. Every job
          # already depends on proxy.golang.org for `go build`, and staticcheck
          # and govulncheck already arrive this way, so gitleaks stops being the
          # one tool carrying its own availability risk. The proxy verifies
          # against the checksum database, and it installs outside the checkout,
          # so the tool is not part of what it scans.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: test (race)
        run: go test -race ./...

      - name: coverage gate (80%)
        run: |
          go test -coverpkg=github.com/Vidimuslabs/xap-go,github.com/Vidimuslabs/xap-go/canonical \
            -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "SDK coverage: ${pct}%"
          awk "BEGIN {exit !(${pct} >= 80.0)}" || (echo "coverage ${pct}% below 80% gate" && exit 1)

      - name: conformance vectors
        run: go run ./cmd/xap vectors run
