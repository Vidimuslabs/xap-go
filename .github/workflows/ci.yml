name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      # xap-go depends on xap-spec; in CI it is checked out as a sibling and
      # resolved via the go.mod replace directive (until xap-spec is published).
      - name: Checkout xap-spec (sibling)
        uses: actions/checkout@v4
        with:
          repository: Vidimuslabs/xap-spec
          path: ../xap-spec

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: test (race)
        run: go test -race ./...

      - name: coverage gate (80%)
        run: |
          go test -coverpkg=github.com/Vidimuslabs/xap-go,github.com/Vidimuslabs/xap-go/canonical \
            -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "SDK coverage: ${pct}%"
          awk "BEGIN {exit !(${pct} >= 80.0)}" || (echo "coverage ${pct}% below 80% gate" && exit 1)

      - name: conformance vectors
        run: go run ./cmd/xap vectors run
