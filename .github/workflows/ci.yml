name: ci
on:
  push:
  pull_request:

# Least privilege. The GITHUB_TOKEN only needs to read this repo; the private
# sibling is fetched with a separate scoped PAT (CI_PAT) below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # xap-go depends on the private xap-spec via a replace directive. Both are
      # checked out side by side under the workspace so `replace ../xap-spec`
      # resolves; the private sibling needs a token with read access (CI_PAT).
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment tracks the version. Dependabot keeps these current.
      # fetch-depth: 0 so the gitleaks step below scans the whole history.
      # checkout defaults to a depth-1 clone, which leaves `gitleaks detect` —
      # a history scanner — with exactly one commit to look at. Making the
      # repository public exposes every commit ever made, so the scan has to
      # cover every commit ever made. Only this checkout needs it; gitleaks does
      # not scan the xap-spec sibling.
      - name: Checkout xap-go
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: xap-go
          fetch-depth: 0
      - name: Checkout xap-spec (private sibling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Vidimuslabs/xap-spec
          token: ${{ secrets.CI_PAT }}
          path: xap-spec

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: xap-go/go.mod

      - name: gofmt
        working-directory: xap-go
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: go vet
        working-directory: xap-go
        run: go vet ./...

      - name: staticcheck
        working-directory: xap-go
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: govulncheck
        working-directory: xap-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        working-directory: xap-go
        run: |
          # Retried and checksum-verified. This step failed three times on
          # 2026-08-12 across three repositories — a 503 from the release host
          # and two dropped connections — each a red main that had nothing to do
          # with the code. A one-shot download piped straight into tar also
          # cannot tell a truncated transfer from a tampered one, since a
          # partial stream just fails to extract.
          # Fetched into the runner's temp dir, not the checkout: the scan runs
          # over `.`, so unpacking the tool into the tree makes the tool part of
          # what it scans.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact --exit-code 1

      - name: test (race)
        working-directory: xap-go
        run: go test -race ./...

      - name: coverage gate (80%)
        working-directory: xap-go
        run: |
          go test -coverpkg=github.com/Vidimuslabs/xap-go,github.com/Vidimuslabs/xap-go/canonical \
            -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "SDK coverage: ${pct}%"
          awk "BEGIN {exit !(${pct} >= 80.0)}" || (echo "coverage ${pct}% below 80% gate" && exit 1)

      - name: conformance vectors
        working-directory: xap-go
        run: go run ./cmd/xap vectors run
