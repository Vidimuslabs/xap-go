name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

# Buildless CodeQL dataflow analysis. Results are saved as a SARIF artifact rather
# than uploaded to code scanning, so this runs on PRIVATE repos without GitHub
# Advanced Security. To surface findings in the Security tab once this repo is
# PUBLIC (free) or GHAS is enabled: set `upload: true` and remove `output:`, add
# `security-events: write` to permissions, and drop the upload-artifact step.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: go
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          category: "/language:go"
          upload: false
          output: codeql-results
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
