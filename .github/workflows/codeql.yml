name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

# CodeQL dataflow analysis, uploaded natively to the Security tab. Code
# scanning is free once the repo is PUBLIC; on a private repo without GHAS the
# Analyze step fails at upload with a 403 — expected until the visibility flip,
# and the run goes green on re-run after it. `actions: read` lets CodeQL read
# workflow-run metadata. This builds standalone: go.mod has no replace, so
# xap-spec arrives from the module proxy like any other dependency.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          category: "/language:go"
